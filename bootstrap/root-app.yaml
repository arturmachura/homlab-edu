# Root application: wzorzec "app of apps".
# Jedyny manifest Argo CD aplikowany ręcznie. Argo CD czyta katalog apps/
# i tworzy z niego wszystkie pozostałe Application.
# Nowa aplikacja w labie = nowy plik w apps/ + commit + push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arturmachura/homlab-edu.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # usunięcie pliku z apps/ usuwa aplikację
      selfHeal: true   # ręczne zmiany w klastrze są cofane do stanu z Git
