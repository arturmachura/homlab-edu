apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: otel-collector
      targetRevision: 0.183.2
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/values/otel-collector.yaml
    - repoURL: https://github.com/arturmachura/homlab-edu.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: otel
    CreateNamespace: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true