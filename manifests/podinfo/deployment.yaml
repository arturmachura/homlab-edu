apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command:
            - ./podinfo
            - --port=9898
            - --port-metrics=9797
          env:
            # Ćwiczenie 1: zmień te wartości w Git i obserwuj synchronizację.
            - name: PODINFO_UI_MESSAGE
              value: "Witaj w homelabie, wdrożone przez Argo CD"
            - name: PODINFO_UI_COLOR
              value: "#2e7d32"
          ports:
            - name: http
              containerPort: 9898
            - name: http-metrics
              containerPort: 9797
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
